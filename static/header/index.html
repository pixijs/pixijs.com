<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PixiJS Nebulon header</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #133a57;
      }

      img,
      #container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      img {
        object-fit: cover;
      }

      #container {
        opacity: 0;
        transition: opacity 0.9s ease;
      }

      #container[data-live] {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!--
      The scene's first live frame, which Nebulon fades in over once it has drawn it. To recapture it after changing the
      scene: frame this page at 1900x1200, post 'resume' then 'pause', and screenshot once #container has data-live.
    -->
    <img src="/header/assets/img/poster.webp" alt="" />
    <div id="container"></div>
    <script>
      (function () {
        // Framed in a page, Nebulon waits for the page to post 'resume'; on its own it starts at once
        var framed = window.parent !== window;
        var wanted = framed ? 'pause' : 'resume';
        var booted = false;
        var container = document.getElementById('container');

        // Seeded, so the clouds are the same on every visit and the first live frame is the poster
        var seed = 1990;

        Math.random = function () {
          seed = (seed + 0x6d2b79f5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        // Frames run before the scene is shown: the clouds fade in first, then the blob forms on the right
        var CLOUD_FRAMES = 240;
        var SCENE_FRAMES = 150;

        // The blob's mask is drawn on the last frame only
        function warm(screen) {
          var mask = screen.maskyMask.texture;
          var render = mask.render;
          var i;

          for (i = 0; i < CLOUD_FRAMES; i++) {
            screen.clouds.update(1);
            screen.stars.update(1);
          }
          mask.render = function () {};
          for (i = 1; i < SCENE_FRAMES; i++) screen.update(1);
          mask.render = render;
          screen.update(1);
        }

        // Skips the fades in and out of the loading screen, which would leave the scene running unseen; each
        // finished fade can start the next
        function skipTransition(app) {
          for (var pass = 0; pass < 4 && app.screenManager.active; pass++) {
            window.TweenLite.getTweensOf([app.loaderScreen, app.ls, app.starsScreen]).forEach(function (tween) {
              tween.seek(tween.totalDuration(), false);
            });
          }
        }

        function reveal(app) {
          var screens = app.screenManager;

          if (screens.active || screens.currentScreen !== app.starsScreen) {
            requestAnimationFrame(function () {
              reveal(app);
            });

            return;
          }
          if (wanted !== 'resume') {
            app.update();
            window.require('com/fido/system/Ticker').instance.stop();
          }
          requestAnimationFrame(function () {
            container.setAttribute('data-live', '');
          });
        }

        function waitForScene() {
          var app = window.app;

          if (!app || !app.starsScreen) {
            requestAnimationFrame(waitForScene);

            return;
          }
          // Nebulon sizes itself on a timer; the blob's filter can't draw into a canvas that hasn't been sized
          if (!app.w) app.resize(window.innerWidth, window.innerHeight);
          warm(app.starsScreen);
          skipTransition(app);
          reveal(app);
        }

        function boot() {
          if (booted) return;
          booted = true;
          var script = document.createElement('script');

          script.src = '/header/js/require.js';
          script.setAttribute('data-main', '/header/js/nebulon.js');
          document.body.appendChild(script);
          requestAnimationFrame(waitForScene);
        }

        // Registered before Nebulon's own listener, which stops on any message but 'resume'
        window.addEventListener('message', function (event) {
          var data = event.data;

          if (event.source !== window.parent && event.source !== window) {
            event.stopImmediatePropagation();

            return;
          }
          if (data && data.type === 'pointer') {
            event.stopImmediatePropagation();
            if (window.app) {
              window.app.view.dispatchEvent(new MouseEvent('mousemove', { clientX: data.x, clientY: data.y }));
            }

            return;
          }
          if (data !== 'resume' && data !== 'pause') {
            event.stopImmediatePropagation();

            return;
          }
          wanted = data;
          if (wanted === 'resume') boot();
        });

        if (wanted === 'resume') boot();
      })();
    </script>
  </body>
</html>
